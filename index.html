<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f2e8">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="두 권의 젤라토 전문서를 챕터별로 읽는 개인 전자책 서재">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; img-src 'self' data: blob:; manifest-src 'self'; object-src 'none'; script-src 'self'; style-src 'self'; worker-src 'self'">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">
  <link rel="stylesheet" href="./css/style.css">
  <title>젤라토 서재</title>
</head>
<body>
  <a class="skip-link" href="#app">본문으로 건너뛰기</a>
  <header class="site-header" id="site-header">
    <a class="brand" href="#/" aria-label="젤라토 서재 홈">
      <span class="brand-mark" aria-hidden="true">G</span>
      <span>
        <strong>젤라토 서재</strong>
        <small>Gelato Library</small>
      </span>
    </a>
    <div class="header-actions">
      <button class="icon-button" id="search-button" type="button" aria-label="책에서 검색" hidden>
        <span aria-hidden="true">⌕</span>
      </button>
      <button class="text-button" id="lock-button" type="button" hidden>잠그기</button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <nav class="bottom-nav" id="bottom-nav" aria-label="주요 메뉴" hidden>
    <a href="#/" data-nav="library"><span aria-hidden="true">⌂</span><span>서재</span></a>
    <a href="#/search" data-nav="search"><span aria-hidden="true">⌕</span><span>검색</span></a>
    <a href="#/bookmarks" data-nav="bookmarks"><span aria-hidden="true">☆</span><span>책갈피</span></a>
    <button type="button" id="reader-settings-button"><span aria-hidden="true">가</span><span>보기</span></button>
  </nav>

  <dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-title">
    <form method="dialog">
      <div class="dialog-header">
        <h2 id="settings-title">읽기 설정</h2>
        <button class="icon-button" value="close" aria-label="설정 닫기">×</button>
      </div>
      <fieldset>
        <legend>글자 크기</legend>
        <div class="segmented" id="font-size-options">
          <button type="button" data-font-size="small">작게</button>
          <button type="button" data-font-size="medium">보통</button>
          <button type="button" data-font-size="large">크게</button>
          <button type="button" data-font-size="xlarge">아주 크게</button>
        </div>
      </fieldset>
      <fieldset>
        <legend>화면 테마</legend>
        <div class="segmented" id="theme-options">
          <button type="button" data-theme-value="light">밝게</button>
          <button type="button" data-theme-value="sepia">미색</button>
          <button type="button" data-theme-value="dark">어둡게</button>
        </div>
      </fieldset>
      <p class="dialog-note">설정만 이 기기에 저장됩니다. 책 본문과 비밀번호는 저장하지 않습니다.</p>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
